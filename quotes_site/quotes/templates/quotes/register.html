{% extends 'quotes/base.html' %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<h2>Реєстрація</h2>
<form method="post">
    {% csrf_token %}
    <p>
        <label for="id_username">Ім’я користувача:</label>
        {{ form.username }}
    </p>
    <p>
        <label for="id_email">Email:</label>
        {{ form.email }}
    </p>
    <p>
        <label for="id_password1">Пароль:</label>
        {{ form.password1 }}
    </p>
    <p>
        <label for="id_password2">Підтвердження пароля:</label>
        {{ form.password2 }}
    </p>
    <button type="submit">Зареєструватися</button>
</form>
{% endblock %}
